name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release (unsigned)
        run: ./gradlew --no-daemon assembleRelease

      - name: SHA-256
        run: |
          mkdir -p artifacts
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$DEBUG_APK" artifacts/dtma-one-0.1.0-debug.apk
          cp "$RELEASE_APK" artifacts/dtma-one-0.1.0-release-unsigned.apk
          sha256sum artifacts/* | tee artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dtma-one-apks
          path: artifacts/
