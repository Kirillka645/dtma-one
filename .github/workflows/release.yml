name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject git SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/GIT_SHA\", \"dev\"/GIT_SHA\", \"$SHA\"/" app/build.gradle.kts || true

      - name: Test + lint + assemble
        run: |
          ./gradlew --no-daemon test lintDebug assembleDebug assembleRelease

      - name: Package artifacts
        id: pkg
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$DEBUG_APK" "dist/dtma-one-${VERSION}-debug.apk"
          cp "$RELEASE_APK" "dist/dtma-one-${VERSION}-release-unsigned.apk"
          (
            cd dist
            sha256sum *.apk > SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DTMA One ${{ steps.pkg.outputs.version }} (debug MVP)
          body: |
            ## DTMA One ${{ steps.pkg.outputs.version }}

            ### Install
            - **Installable test build:** `dtma-one-${{ steps.pkg.outputs.version }}-debug.apk`
            - Marked as **debug/test** (`app.dtma.one.debug`). Not a production-signed release.
            - `dtma-one-${{ steps.pkg.outputs.version }}-release-unsigned.apk` is an **unsigned** build product (not installable without signing).

            ### Features
            - Local `VpnService` with real TUN dataplane (IPv4 TCP/UDP/DNS) and `protect()`
            - PAER: endpoint racing, RVEC, Passive Hypothesis Engine
            - Built-in strict HTTPS test (platform TLS validation)
            - Material 3 UI (RU/EN)
            - No remote VPN server, ads, or telemetry

            ### Limitations
            - Does **not** guarantee bypass of blocks
            - No TLS MITM; third-party certs not validated by DTMA One
            - QUIC racing NOT_IMPLEMENTED
            - See `docs/FEASIBILITY.md` and `docs/KNOWN_LIMITATIONS.md`

            ### Checksums
            See `SHA256SUMS.txt` attached.
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
